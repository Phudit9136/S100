name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find project folder (the one containing settings.gradle)
        run: |
          DIR=$(find . -name settings.gradle -not -path './.git/*' -print -quit | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "settings.gradle not found. Repo layout:"; find . -not -path './.git/*' | head -50; exit 1
          fi
          echo "Project folder: $DIR"
          echo "APP_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 11 }
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5.1
      - run: gradle assembleDebug
        working-directory: ${{ env.APP_DIR }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Keenon Remote (latest)
          files: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/app-debug.apk
